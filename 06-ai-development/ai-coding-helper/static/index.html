<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 编程小助手 · 码小安</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif;
           background: #0f1320; color: #e6e8ef; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; background: #161b2e; border-bottom: 1px solid #232a44; }
    header h1 { margin: 0; font-size: 18px; }
    header span { color: #8b93b0; font-size: 12px; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 820px; width: 100%; margin: 0 auto; }
    .msg { margin: 12px 0; display: flex; gap: 10px; }
    .msg .who { flex: 0 0 56px; color: #8b93b0; font-size: 13px; padding-top: 2px; }
    .msg .body { white-space: pre-wrap; line-height: 1.6; background: #1b2138;
                 padding: 10px 14px; border-radius: 10px; flex: 1; }
    .msg.user .body { background: #24407a; }
    footer { padding: 14px 20px; background: #161b2e; border-top: 1px solid #232a44; }
    .inputbar { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
    #input { flex: 1; resize: none; height: 46px; padding: 12px; border-radius: 10px;
             border: 1px solid #2b3252; background: #0f1320; color: #e6e8ef; font-size: 14px; }
    #send { padding: 0 22px; border: 0; border-radius: 10px; background: #4f7cff;
            color: #fff; font-size: 14px; cursor: pointer; }
    #send:disabled { background: #3a4470; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>AI 编程小助手 · 码小安</h1>
    <span>DeepSeek + SSE 流式 · 多会话记忆 | 仅用于学习与防御研究</span>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="inputbar">
      <textarea id="input" placeholder="问点编程问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </div>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    // 每个浏览器会话一个 session_id（对标 @MemoryId 多会话隔离）
    const sessionId = "web-" + Math.random().toString(36).slice(2, 10);

    function addMsg(who, cls) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + cls;
      wrap.innerHTML = `<div class="who">${who}</div><div class="body"></div>`;
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap.querySelector(".body");
    }

    async function ask(text) {
      addMsg("你", "user").textContent = text;
      const out = addMsg("码小安", "bot");
      send.disabled = true;

      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // 按 SSE 事件边界（空行）切分
          const events = buffer.split("\n\n");
          buffer = events.pop();
          for (const evt of events) {
            const line = evt.replace(/^data: /, "").trim();
            if (line === "[DONE]" || !line) continue;
            const data = JSON.parse(line);
            if (data.error) { out.textContent += "\n[错误] " + data.error; }
            else if (data.delta) { out.textContent += data.delta; }
            chat.scrollTop = chat.scrollHeight;
          }
        }
      } catch (e) {
        out.textContent += "\n[请求失败] " + e.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    function submit() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      ask(text);
    }

    send.addEventListener("click", submit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
    });
  </script>
</body>
</html>
